name: release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: false
      - name: Build wheel
        run: uv build --wheel --no-sources
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  test:
    needs: build
    name: Test wheel on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: wheel
          path: dist
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install wheel and test dependencies
        run: |
          uv export --only-group dev --no-emit-project --no-hashes --frozen \
            --output-file release-requirements.txt
          uv venv --python ${{ matrix.python-version }} .release-venv
          uv pip install --python .release-venv/bin/python \
            --requirements release-requirements.txt dist/*.whl
      - name: Run tests against wheel
        run: .release-venv/bin/python -m pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mplchart
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: wheel
          path: dist
      - name: Publish wheel to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
