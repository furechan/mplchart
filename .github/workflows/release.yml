# Validate a version tag, build its wheel, approve, and publish to PyPI.
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Match tag, package version, and PyPI
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match project version {version!r}")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"release version must be a plain three-part version: {version!r}")

          url = f"https://pypi.org/pypi/mplchart/{version}/json"
          try:
              urllib.request.urlopen(url, timeout=10)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print(f"Validated unpublished release {version}")
              else:
                  raise
          else:
              raise SystemExit(f"mplchart {version} already exists on PyPI")
          PY

  build:
    name: Build and test
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  publish:
    name: Confirm and publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mplchart
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Publish wheel to PyPI
        run: uv publish --trusted-publishing always dist/*
