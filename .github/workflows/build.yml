# Build and test the release wheel.
name: Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - name: Build wheel
        run: uv build --wheel --no-sources
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  test:
    needs: build
    name: Test wheel on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install wheel and test dependencies
        run: |
          uv export --only-group dev --no-emit-project --no-hashes --frozen \
            --output-file release-requirements.txt
          uv venv --python ${{ matrix.python-version }} .release-venv
          uv pip install --python .release-venv/bin/python \
            --requirements release-requirements.txt dist/*.whl
      - name: Run tests against wheel
        run: .release-venv/bin/python -m pytest
