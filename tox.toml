# tox configuration
# https://tox.wiki/en/latest/config.html
#
# Usage:
#   tox            # everyday set: tests + pandas + polars + ruff + ty
#   tox -m full    # full pre-publish matrix (Python 3.10-3.14)
#   tox list       # list environments

work_dir = ".venv/tox"
env_list = ["tests", "pandas", "polars", "ruff", "ty"]

[labels]
full = ["tests", "3.10", "3.11", "3.12", "3.13", "3.14", "pandas", "polars", "ruff", "ty"]

[env_run_base]
deps = ["pytest"]
extras = ["pandas", "polars"]
commands = [["python", "-m", "pytest"]]
set_env = { PYTHONDONTWRITEBYTECODE = "1" }

# test suite on the default interpreter with both backends
[env.tests]

[env.ruff]
deps = ["ruff"]
commands = [["python", "-m", "ruff", "check"]]
set_env = { RUFF_CACHE_DIR = ".venv/ruff_cache" }
skip_install = true

# type check — locked resolution (uv.lock) so results match `uv run ty check`;
# dev+docs groups make every checked import resolve (notebooks, scripts)
[env.ty]
runner = "uv-venv-lock-runner"
dependency_groups = ["dev", "docs"]
commands = [["python", "-m", "ty", "check"]]

# pandas-only install — polars tests skip via importorskip
[env.pandas]
deps = ["pytest"]
extras = ["pandas"]

# polars-only install — pandas tests skip via importorskip
[env.polars]
deps = ["pytest"]
extras = ["polars"]
