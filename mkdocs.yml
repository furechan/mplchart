site_name: mplchart
site_description: Classic technical analysis stock charts in Python, built on matplotlib
site_url: https://furechan.github.io/mplchart/
repo_url: https://github.com/furechan/mplchart
repo_name: furechan/mplchart

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Gallery: gallery.ipynb
  - Tutorials:
      - Typical usage: examples/typical-usage.ipynb
      - How indicators work: examples/indicators.ipynb
      - How primitives work: examples/primitives.ipynb
      - How expressions work: examples/expressions.ipynb
      - Pandas and polars backends: backends.md
      - Exporting charts to SVG and PNG: examples/chart-export.ipynb
      - Plotting TA-Lib indicators: examples/talib-functions.ipynb
  - Reference:
      - reference/index.md
      - Chart: reference/chart.md
      - Primitives: reference/primitives.md
      - Indicators: reference/indicators.md
      - Expressions: reference/expressions.md
      - Styles: reference/styles.md
  - Articles:
      - Comparing multiple tickers: articles/multiple-tickers.ipynb
      - mplfinance vs mplchart: articles/mplfinance.ipynb
      - Plotting trend lines in Python: articles/trendlines.ipynb
